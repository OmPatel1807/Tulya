services:
  - type: web
    name: tulya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TULYA_DEPLOY_MODE
        value: precomputed
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
